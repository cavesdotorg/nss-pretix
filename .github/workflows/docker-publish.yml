name: Build and publish pretix image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.pretix
      - pretix-plugin-member-gate/**
      - pretixcron.conf

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract pretix version
        id: version
        run: |
          echo "pretix_version=$(grep 'FROM pretix/standalone' Dockerfile.pretix | sed 's/.*standalone://')" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.pretix
          push: true
          tags: |
            ghcr.io/paulwalko/nss-pretix:${{ steps.version.outputs.pretix_version }}-${{ github.run_number }}
            ghcr.io/paulwalko/nss-pretix:latest
